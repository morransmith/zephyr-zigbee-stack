CONFIG_ZTEST=y
CONFIG_ZZB=y
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
# The RX test passes frames with two trailing bytes
CONFIG_IEEE802154_L2_PKT_INCL_FCS=y
# native_sim enables Ethernet, which needs the net_if code that raw mode leaves out
CONFIG_NET_L2_ETHERNET=n
