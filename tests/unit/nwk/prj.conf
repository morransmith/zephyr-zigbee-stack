CONFIG_ZTEST=y
CONFIG_ZZB=y
# The MAC is faked
CONFIG_ZZB_NWK=y
# The test defines the NLDE callbacks
CONFIG_ZZB_APS=n
CONFIG_ZZB_NODE_COUNT=2
CONFIG_ZZB_FRAME_COUNTER_JUMP=16
# 10 s, so the keepalive runs every 3.33 s
CONFIG_ZZB_NWK_ED_TIMEOUT=0
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Every run starts with erased flash
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--flash_in_ram"
