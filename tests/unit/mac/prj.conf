# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y
CONFIG_ZZB=y
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
# Injected frames have no trailing FCS or LQI bytes
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n
# native_sim enables Ethernet, which needs the net_if code that raw mode leaves out
CONFIG_NET_L2_ETHERNET=n
