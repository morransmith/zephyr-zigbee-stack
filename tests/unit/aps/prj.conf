CONFIG_ZTEST=y
CONFIG_ZZB=y
# NWK is faked
CONFIG_ZZB_APS=y
# The test defines the APSDE and APSME callbacks
CONFIG_ZZB_ZDO=n
CONFIG_ZZB_NODE_COUNT=3
CONFIG_ZZB_FRAME_COUNTER_JUMP=16
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Every run starts with erased flash
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--flash_in_ram"
