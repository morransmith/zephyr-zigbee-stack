# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y
CONFIG_ZZB=y
# BDB, ZDO, APS and NWK are faked
CONFIG_ZZB_ZCL=y
CONFIG_ZZB_ZCL_REPORT_COUNT=4
CONFIG_ZZB_ZCL_SCENE_COUNT=4
CONFIG_ZZB_ZCL_ALARM_COUNT=4
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Every run starts with erased flash
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--flash_in_ram"
# The Time, Poll Control and OTA Upgrade tests have a node of their own each
CONFIG_ZZB_NODE_COUNT=4
# The OTA Upgrade client writes the upload slot of the flash simulator without a bootloader
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_ZZB_ZCL_OTA=y
