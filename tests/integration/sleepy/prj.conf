# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y
CONFIG_ZZB=y
CONFIG_ZZB_NODE_COUNT=1
CONFIG_NETWORKING=y
CONFIG_NET_L2_CUSTOM_IEEE802154=y
CONFIG_NET_IPV6=n
# A frame reaches the receiving port within the tx() of the sending radio
CONFIG_NET_TC_RX_COUNT=0
# native_sim enables Ethernet, which would add a TAP interface
CONFIG_NET_L2_ETHERNET=n
# ci/check-frame-log.sh reads the frame log of the medium
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Every run starts with erased flash
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--flash_in_ram"
