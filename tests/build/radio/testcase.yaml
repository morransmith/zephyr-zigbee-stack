tests:
  zzb.build.radio:
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
      - nrf52840dk/nrf52840
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32h2_devkitm/esp32h2
  # The esp32 driver has no #if branch for CONFIG_NET_L2_CUSTOM_IEEE802154
  zzb.build.radio.custom_l2:
    build_only: true
    platform_allow:
      - nrf52840dk/nrf52840
    extra_args: FILE_SUFFIX=custom_l2
