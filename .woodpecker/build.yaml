# SPDX-License-Identifier: Apache-2.0

when:
  - event: [push, pull_request, manual]

# west init -l makes the parent of the repository the west topdir, so zephyr
# and the modules are cloned into the workspace volume shared by all steps.
workspace:
  base: /woodpecker
  path: zephyr-zigbee-stack

variables:
  - &image ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.1.20260327

steps:
  - name: west
    image: *image
    commands:
      - west init -l .
      - west update --path-cache /repo-cache/zephyrproject
      - west blobs fetch hal_espressif --allow-regex 'lib/esp32(c6|h2)/'

  - name: native_sim
    image: *image
    depends_on: [west]
    commands:
      - west twister -T tests -p native_sim -p native_sim/native/64 -O twister-out-native --inline-logs

  # tshark 4.2.2 on Ubuntu 24.04
  - name: frame-log
    image: antrea/tshark@sha256:80825a3937c4f68ea6eed7a36bb4a962ad74d4bc198c357037a83d6c38965948
    depends_on: [native_sim]
    commands:
      - ci/check-frame-log.sh twister-out-native

  - name: hardware
    image: *image
    depends_on: [west]
    commands:
      # Installs esptool and imgtool from the requirements of hal_espressif and mcuboot into this
      # step's container.
      - west packages pip --install
      - >-
        west twister -T tests --build-only -O twister-out-hw --inline-logs
        -p nrf52840dk/nrf52840
        -p esp32c6_devkitc/esp32c6/hpcore
        -p esp32h2_devkitm/esp32h2
