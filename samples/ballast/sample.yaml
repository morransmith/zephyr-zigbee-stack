# SPDX-License-Identifier: Apache-2.0

sample:
  name: zzb ballast
common:
  build_only: true
  platform_allow:
    - nrf52840dk/nrf52840
    - esp32c6_devkitc/esp32c6/hpcore
    - esp32h2_devkitm/esp32h2
  integration_platforms:
    - nrf52840dk/nrf52840
tests:
  sample.zzb.ballast.on_off_ballast:
    extra_configs:
      - CONFIG_SAMPLE_ON_OFF_BALLAST=y
  sample.zzb.ballast.dimmable_ballast:
    extra_configs:
      - CONFIG_SAMPLE_DIMMABLE_BALLAST=y
