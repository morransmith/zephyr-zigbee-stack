# SPDX-License-Identifier: Apache-2.0

sample:
  name: zzb energy
common:
  build_only: true
  platform_allow:
    - nrf52840dk/nrf52840
    - esp32c6_devkitc/esp32c6/hpcore
    - esp32h2_devkitm/esp32h2
  integration_platforms:
    - nrf52840dk/nrf52840
tests:
  sample.zzb.energy.smart_plug:
    extra_configs:
      - CONFIG_SAMPLE_SMART_PLUG=y
  sample.zzb.energy.meter_interface:
    extra_configs:
      - CONFIG_SAMPLE_METER_INTERFACE=y
  sample.zzb.energy.consumption_awareness_device:
    extra_configs:
      - CONFIG_SAMPLE_CONSUMPTION_AWARENESS_DEVICE=y
  sample.zzb.energy.white_goods:
    extra_configs:
      - CONFIG_SAMPLE_WHITE_GOODS=y
  sample.zzb.energy.home_gateway:
    extra_configs:
      - CONFIG_SAMPLE_HOME_GATEWAY=y
